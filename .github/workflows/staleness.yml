# Content health check: dead links + possibly outdated statements.
#
# This workflow is a **template for content repos** (palemoky/readings, palemoky/leetcode),
# not for bookling itself. Copy it into the content repo's .github/workflows/;
# the check logic stays in bookling and is maintained in one place.
#
# Cost: Actions minutes are unlimited for public repos, so dead-link and wording checks are free.
# Model review (review > 0) uses Workers AI's daily free quota, which caps the number of items.
name: Content health check

on:
  schedule:
    - cron: "0 2 1 * *"   # 1st of every month
  workflow_dispatch:
    inputs:
      review:
        description: "Max number of articles for model review (0 = no model)"
        default: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content repo
        uses: actions/checkout@v7
        with:
          # Full history is required: "how long since last modified" relies on git log.
          # With a shallow clone every file's date is the checkout time, and the signal is lost entirely.
          fetch-depth: 0

      # The check script lives in bookling; two ways to get it are supported:
      #
      #   A. Keep a copy of scripts/staleness.mjs in the repo (single file, zero deps, just copy it)
      #      — zero config, at the cost of syncing updates by hand
      #   B. Check it out from bookling — single source of truth, but if bookling is private a PAT is **required**:
      #      the default GITHUB_TOKEN only has access to the current repo; checking out another private repo returns 404
      - name: Check out bookling (when the repo has no local copy)
        if: ${{ hashFiles('scripts/staleness.mjs') == '' }}
        uses: actions/checkout@v7
        with:
          repository: palemoky/bookling
          ref: main
          path: .bookling
          # Can be removed if bookling is public; required if private
          token: ${{ secrets.BOOKLING_REPO_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run check
        id: check
        run: |
          SCRIPT=scripts/staleness.mjs
          [ -f "$SCRIPT" ] || SCRIPT=.bookling/scripts/staleness.mjs
          echo "Using $SCRIPT"
          node "$SCRIPT" \
            --repo . --out STALENESS.md \
            --stale-months 12 \
            --review "${{ github.event.inputs.review || 0 }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Clean up temporary checkout
        run: rm -rf .bookling

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/staleness
          # Fixed branch name + reuse the same PR: a new PR every month is just noise,
          # while one continuously updated PR shows directly "what's new this month vs. last month"
          title: "Content health check: ${{ steps.check.outputs.dead }} dead links / ${{ steps.check.outputs.stale }} to review"
          commit-message: "chore: update content health check report"
          add-paths: STALENESS.md
          delete-branch: false
          body: |
            Auto-generated content health check report. The only changed file is `STALENESS.md`.

            - **Dead links**: ${{ steps.check.outputs.dead }} — hard signal, almost no false positives
            - **Possibly outdated**: ${{ steps.check.outputs.stale }} — heuristic hints, **false positives expected**

            An article is flagged "possibly outdated" when it hasn't been modified for over 12 months **and**
            contains time-sensitive phrasing such as 「目前」 (currently), 「最新」 (latest), 「截至 20XX」 (as of 20XX), or hard-coded version numbers.
            Such phrasing isn't wrong in itself; it's just worth a look.

            Merge once fixed; if you don't want to change anything, close the PR and the next check will reopen it.
